# General task policy. No project, framework, or business-specific rules are required.
default:
  model: gpt-6.1-sol
  reasoning: high
# These routes also apply to heuristic/classifier decisions; no model names are hardcoded.
tiers:
  high_risk:
    model: gpt-6.1-sol
    reasoning: xhigh
  architecture:
    model: gpt-6.1-sol
    reasoning: max
  complex:
    model: gpt-6.1-sol
    reasoning: xhigh
  simple:
    model: gpt-6-luna
    reasoning: xhigh
    enabled: true
    max_complexity: 1
    categories: [style, documentation, transformation]

# Optional local overrides. Leave empty for project-independent routing.
rules: []
